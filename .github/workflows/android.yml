# Builds an installable Android test app (APK) on every push to main.
# Download it from the "Releases" section of the GitHub repo, on your phone.
name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04   # comes with the Android SDK already installed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk LaserCage-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: LaserCage-apk, path: LaserCage-*.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Test build ${{ github.run_number }}
          body: Debug build for testing. Open this page on your Android phone and tap the .apk file to install.
          files: LaserCage-*.apk
